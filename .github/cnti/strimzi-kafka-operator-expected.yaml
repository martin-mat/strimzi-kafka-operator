# The essential tests' results Strimzi knows and accepts, for the CNTi job
# (.github/workflows/cnti.yml, expected_results). A test not listed is
# expected to pass. When a result changes, the job says so in its summary and
# as a warning; the badge doesn't change. Update this file in the pull request
# that changes the result.
- test: cpu_limits
  status: failed
  reason: >-
    The Entity Operator's topic-operator and user-operator containers have no
    resources unless the Kafka resource sets them
- test: memory_limits
  status: failed
  reason: >-
    The Entity Operator's topic-operator and user-operator containers have no
    resources unless the Kafka resource sets them
- test: non_root_containers
  status: failed
  reason: >-
    The images run as uid 1001 in group 0, for OpenShift's arbitrary user ids;
    the Entity Operator's containers also don't declare runAsNonRoot
